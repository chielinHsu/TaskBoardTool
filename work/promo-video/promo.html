<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>TaskBoardTool 15 秒動態簡報</title>
<style>
  html,body{margin:0;background:#05070b;height:100%;overflow:hidden}
  canvas{display:block;width:1920px;height:1080px}
  #ui{position:fixed;left:12px;top:12px;z-index:2;font:14px "Microsoft JhengHei UI",sans-serif;color:#fff;display:flex;gap:8px;align-items:center}
  #ui button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #ffffff33;background:#1c2330;color:#fff;cursor:pointer}
  #ui input{width:420px}
  body.record #ui{display:none}
</style>
</head>
<body>
<div id="ui"><button id="play">▶ 播放（含音樂）</button><input id="seek" type="range" min="0" max="15" step="0.01" value="0"><span id="time">0.00s</span></div>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, DUR = 15;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const FONT = '"Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif';
const C = {
  bg: '#05070b', panel: '#10151d', column: '#141a24', card: '#1b2230', line: 'rgba(255,255,255,0.10)',
  ink: '#f2f5f9', muted: '#94a0b2', accent: '#339cff', orange: '#f0a35a', purple: '#b495d0', green: '#40c977',
  status: { backlog: '#97a6b3', todo: '#d5a468', in_progress: '#638fba', in_review: '#b495d0', done: '#569d81' },
};
const STATUSES = [['backlog', '列管'], ['todo', '待辦'], ['in_progress', '進行中'], ['in_review', '待審核'], ['done', '已完成']];

// ---------- 工具 ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = {
  out: p => 1 - Math.pow(1 - p, 3),
  inOut: p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  in: p => p * p * p,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  spring: p => 1 - Math.cos(p * Math.PI * 2.2) * Math.exp(-p * 5),
};
// t 在 [a,b] 內的進度，套用 easing
const seg = (t, a, b, fn = ease.out) => fn(clamp((t - a) / (b - a)));
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, { size = 20, weight = 400, color = C.ink, align = 'left', baseline = 'alphabetic', alpha = 1, ls = 0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = baseline;
  if (ls) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, size, weight = 400) { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(s).width; }
function pill(label, x, y, { bg, fg, size = 15, weight = 650, padX = 10, h = 26, alpha = 1 } = {}) {
  const w = measure(label, size, weight) + padX * 2;
  ctx.save(); ctx.globalAlpha *= alpha; rr(x, y, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  text(label, x + padX, y + h / 2 + 1, { size, weight, color: fg, baseline: 'middle' }); ctx.restore();
  return w;
}
function glow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// ---------- 背景 ----------
function drawBackground(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, W * 0.75);
  g.addColorStop(0, '#0e1420'); g.addColorStop(1, '#05070b'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 網格
  ctx.save(); ctx.strokeStyle = 'rgba(51,156,255,0.055)'; ctx.lineWidth = 1; const s = 80, off = (t * 12) % s;
  ctx.beginPath(); for (let x = -s + off; x < W + s; x += s) { ctx.moveTo(x, 0); ctx.lineTo(x, H); } for (let y = -s + off * 0.5; y < H + s; y += s) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke(); ctx.restore();
  // 光暈
  glow(W * 0.18 + Math.sin(t * 0.5) * 60, H * 0.25 + Math.cos(t * 0.4) * 40, 520, 'rgba(51,156,255,0.20)', 1);
  glow(W * 0.85 + Math.cos(t * 0.35) * 50, H * 0.8 + Math.sin(t * 0.45) * 40, 560, 'rgba(180,149,208,0.17)', 1);
  glow(W * 0.55, H * 1.05, 700, 'rgba(64,201,119,0.08)', 1);
  // 暗角
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ---------- 共用 UI 元件 ----------
const TOOL = { codex: { label: 'Codex', bg: 'rgba(51,156,255,0.18)', fg: '#7cc0ff' }, claude: { label: 'Claude Code', bg: 'rgba(240,163,90,0.18)', fg: '#f6b878' } };
const PRI = { urgent: ['緊急', '#ff8583'], high: ['高', '#ffd240'], medium: ['中', '#94a0b2'], low: ['低', '#6f7b8b'] };

function drawCard(x, y, w, card, { alpha = 1, scale = 1, h = 118, highlight = 0, progress = null, shadow = true, status = null, model = null, ghost = false } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(scale, scale); ctx.translate(-w / 2, -h / 2);
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; }
  rr(0, 0, w, h, 12); ctx.fillStyle = ghost ? 'rgba(27,34,48,0.5)' : C.card; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = highlight ? 2 : 1; ctx.strokeStyle = highlight ? rgba(C.accent, 0.4 + 0.6 * highlight) : C.line; ctx.stroke();
  if (highlight) { ctx.save(); ctx.globalAlpha *= highlight * 0.6; ctx.shadowColor = C.accent; ctx.shadowBlur = 30; ctx.strokeStyle = C.accent; ctx.stroke(); ctx.restore(); }
  // 左側狀態色條
  const st = status || card.status; if (st) { rr(0, 10, 4, h - 20, 2); ctx.fillStyle = C.status[st]; ctx.fill(); }
  text(card.title, 20, 36, { size: 21, weight: 650, color: C.ink });
  let px = 20; px += pill(TOOL[card.tool].label, px, 52, { bg: TOOL[card.tool].bg, fg: TOOL[card.tool].fg }) + 8;
  if (model || card.model) { px += pill(model || card.model, px, 52, { bg: 'rgba(255,255,255,0.08)', fg: C.muted, weight: 500 }) + 8; }
  if (card.pri) { const [l, c] = PRI[card.pri]; px += pill(l, px, 52, { bg: rgba(c, 0.16), fg: c }) + 8; }
  text(card.project || '', 20, h - 18, { size: 15, color: C.muted });
  if (progress != null) { rr(16, h - 10, w - 32, 5, 3); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill(); rr(16, h - 10, (w - 32) * clamp(progress), 5, 3); ctx.fillStyle = C.accent; ctx.fill(); }
  ctx.restore();
}
function miniCard(x, y, w, title, status, { alpha = 1, scale = 1, highlight = 0 } = {}) {
  const h = 84; ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x + w / 2, y + h / 2); ctx.scale(scale, scale); ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6; rr(0, 0, w, h, 10); ctx.fillStyle = C.card; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = highlight ? 2 : 1; ctx.strokeStyle = highlight ? C.accent : C.line; ctx.stroke();
  rr(0, 8, 3, h - 16, 2); ctx.fillStyle = C.status[status]; ctx.fill();
  text(title, 14, 30, { size: 16, weight: 650 }); pill('Claude Code', 14, 42, { bg: TOOL.claude.bg, fg: TOOL.claude.fg, size: 12, h: 22, padX: 8 }); text('網站', 14, h - 8, { size: 12, color: C.muted });
  ctx.restore();
}
function drawPanel(x, y, w, h, { alpha = 1, radius = 20, title = null } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  rr(x, y, w, h, radius); ctx.fillStyle = C.panel; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}
function drawAppHeader(x, y, w, { alpha = 1, auto = true } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  // 標題列
  ctx.fillStyle = 'rgba(255,255,255,0.03)'; rr(x, y, w, 64, [20, 20, 0, 0]); ctx.fill();
  ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(x, y + 64); ctx.lineTo(x + w, y + 64); ctx.stroke();
  // 視窗燈號
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { ctx.beginPath(); ctx.arc(x + 28 + i * 22, y + 32, 6, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); });
  text('任務看板', x + 110, y + 40, { size: 22, weight: 700 });
  text('TaskBoardTool', x + 212, y + 40, { size: 16, color: C.muted, weight: 500 });
  // 右側切換
  const tx = x + w - 300; rr(tx, y + 18, 52, 28, 14); ctx.fillStyle = auto ? C.accent : 'rgba(255,255,255,0.15)'; ctx.fill();
  ctx.beginPath(); ctx.arc(tx + (auto ? 38 : 14), y + 32, 10, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  text(auto ? '自動派工 · 每 5 秒領取待辦任務' : '手動派工', tx + 64, y + 38, { size: 16, color: C.muted, weight: 500 });
  ctx.restore();
}

// ---------- 場景資料 ----------
const BOARD_CARDS = {
  backlog: [{ title: '整理 README 安裝說明', tool: 'codex', pri: 'low', project: '任務看板' }, { title: '設計深色模式色票', tool: 'claude', pri: 'medium', project: '網站' }],
  todo: [{ title: '新增 SQLite migration', tool: 'claude', pri: 'high', project: '任務看板' }, { title: '匯入計畫 API 測試', tool: 'codex', pri: 'medium', project: '任務看板' }],
  in_progress: [{ title: '實作 iframe 主題同步', tool: 'claude', pri: 'high', project: '任務看板', model: 'sonnet' }],
  in_review: [{ title: '修正排程重試邏輯', tool: 'codex', pri: 'urgent', project: '任務看板' }],
  done: [{ title: '建立桌面捷徑啟動器', tool: 'codex', pri: 'medium', project: '任務看板' }, { title: 'Claude session 同步', tool: 'claude', pri: 'high', project: '任務看板' }],
};
const PLAN = [
  { key: 'a', title: '盤點現有色票與 token', role: 'fast-worker', model: 'haiku', effort: 'low', deps: [] },
  { key: 'b', title: '設計深色模式配色', role: 'architect', model: 'opus', effort: 'high', deps: ['a'] },
  { key: 'c', title: '實作 CSS 變數切換', role: 'developer', model: 'sonnet', effort: 'medium', deps: ['b'] },
  { key: 'd', title: '加入主題切換按鈕', role: 'developer', model: 'sonnet', effort: 'medium', deps: ['b'] },
  { key: 'e', title: '驗證明暗與自訂色彩', role: 'developer-deep', model: 'sonnet', effort: 'high', deps: ['c', 'd'] },
];

// ---------- 字幕與場景標籤 ----------
function subtitle(s, t, a, b, { y = H - 92 } = {}) {
  const inP = seg(t, a, a + 0.5), outP = seg(t, b - 0.35, b, ease.in); const alpha = inP * (1 - outP); if (alpha <= 0) return;
  const size = 46, w = measure(s, size, 700) + 80;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(0, (1 - inP) * 26 + outP * -14);
  rr(W / 2 - w / 2, y - 40, w, 80, 40); ctx.fillStyle = 'rgba(8,11,17,0.78)'; ctx.fill(); ctx.strokeStyle = 'rgba(51,156,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  // 底部光條
  const g = ctx.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0); g.addColorStop(0, 'rgba(51,156,255,0)'); g.addColorStop(0.5, 'rgba(51,156,255,0.9)'); g.addColorStop(1, 'rgba(51,156,255,0)');
  ctx.fillStyle = g; ctx.fillRect(W / 2 - w / 2 + 40, y + 36, w - 80, 2);
  text(s, W / 2, y + 2, { size, weight: 700, align: 'center', baseline: 'middle', ls: 1 });
  ctx.restore();
}
function sceneTag(no, label, t, a, b) {
  const alpha = seg(t, a, a + 0.4) * (1 - seg(t, b - 0.3, b, ease.in)); if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate((1 - seg(t, a, a + 0.5)) * -30, 0);
  rr(64, 48, 300, 50, 25); ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill(); ctx.strokeStyle = C.line; ctx.stroke();
  text(no, 90, 74, { size: 20, weight: 800, color: C.accent, baseline: 'middle', ls: 2 });
  text(label, 134, 74, { size: 20, weight: 600, baseline: 'middle', color: C.ink });
  ctx.restore();
}

// ---------- 場景 1：集中管理任務（0–5s） ----------
function scene1(t) {
  const enter = seg(t, 0, 1.1, ease.out), leave = seg(t, 4.55, 5.0, ease.in);
  const bx = 120, by = 150, bw = 1680, bh = 780;
  ctx.save();
  // 介面縮放進場，離場時拉近並淡出
  const sc = lerp(1.08, 1, enter) * lerp(1, 1.12, leave); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = enter * (1 - leave);
  drawPanel(bx, by, bw, bh); drawAppHeader(bx, by, bw);
  // 工具列
  rr(bx + 32, by + 86, 420, 40, 10); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill(); text('⌕  搜尋任務、需求或專案', bx + 48, by + 112, { size: 16, color: C.muted });
  let fx = bx + 470; for (const f of ['全部工具 ▾', '全部專案 ▾', '全部優先級 ▾']) { const w = measure(f, 16) + 28; rr(fx, by + 86, w, 40, 10); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill(); text(f, fx + 14, by + 112, { size: 16, color: C.muted }); fx += w + 10; }
  // 欄位
  const colW = 312, gap = 20, cy = by + 150, colH = bh - 180; let i = 0, cardIndex = 0;
  for (const [key, label] of STATUSES) {
    const p = seg(t, 0.25 + i * 0.12, 0.85 + i * 0.12, ease.out), cx = bx + 32 + i * (colW + gap);
    ctx.save(); ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * 40);
    rr(cx, cy, colW, colH, 14); ctx.fillStyle = C.column; ctx.fill(); ctx.strokeStyle = C.line; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 24, cy + 30, 6, 0, Math.PI * 2); ctx.fillStyle = C.status[key]; ctx.fill();
    text(label, cx + 42, cy + 37, { size: 20, weight: 700 });
    const cards = BOARD_CARDS[key]; const shown = cards.filter((_, j) => t >= 1.0 + (cardIndex + j) * 0.22).length;
    rr(cx + colW - 58, cy + 16, 36, 28, 14); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill(); text(String(shown), cx + colW - 40, cy + 31, { size: 15, align: 'center', baseline: 'middle', color: C.muted, weight: 600 });
    cards.forEach((card, j) => {
      const idx = cardIndex + j, cp = seg(t, 1.0 + idx * 0.22, 1.55 + idx * 0.22, ease.back); if (cp <= 0) return;
      const prog = key === 'in_progress' ? clamp((t - 2.6) / 2.2) * 0.72 : null;
      drawCard(cx + 14, cy + 64 + j * 134, colW - 28, card, { alpha: clamp(cp * 1.5), scale: lerp(0.8, 1, cp), progress: prog, highlight: key === 'in_progress' ? 0.35 + 0.35 * Math.sin(t * 5) : 0 });
    });
    cardIndex += cards.length; i++;
    ctx.restore();
  }
  ctx.restore();
  sceneTag('01', '集中管理任務', t, 0.3, 4.8);
  subtitle('Codex × Claude Code，一個看板掌握進度', t, 1.6, 4.8);
}

// ---------- 場景 2：從計畫到執行（5–10s） ----------
const NODE_POS = { a: [0, 1], b: [1, 1], c: [2, 0.4], d: [2, 1.6], e: [3, 1] };
function nodeXY(key, ox, oy) { const [cx, cy] = NODE_POS[key]; return [ox + cx * 322, oy + cy * 160]; }
function scene2(t) {
  const t0 = t - 5; // 區域時間 0..5
  const enter = seg(t0, 0, 0.6), leave = seg(t0, 4.6, 5.0, ease.in);
  ctx.save(); ctx.globalAlpha = enter * (1 - leave);
  const sc = lerp(0.96, 1, enter) * lerp(1, 1.1, leave); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
  // 左：計畫文件
  const px = 110, py = 170, pw = 460, ph = 700, planIn = seg(t0, 0, 0.7);
  ctx.save(); ctx.globalAlpha *= planIn; ctx.translate((1 - planIn) * -40, 0);
  drawPanel(px, py, pw, ph); text('匯入計畫', px + 32, py + 56, { size: 24, weight: 700 }); pill('plan.json', px + 150, py + 36, { bg: 'rgba(255,255,255,0.08)', fg: C.muted, weight: 500 });
  text('深色模式 · 專案「網站」 · Claude Code', px + 32, py + 94, { size: 16, color: C.muted });
  PLAN.forEach((it, i) => {
    const y = py + 130 + i * 104, p = seg(t0, 0.3 + i * 0.1, 0.8 + i * 0.1); ctx.save(); ctx.globalAlpha *= p;
    rr(px + 24, y, pw - 48, 88, 12); ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill(); ctx.strokeStyle = C.line; ctx.stroke();
    text(`${i + 1}. ${it.title}`, px + 44, y + 34, { size: 19, weight: 650 });
    let xx = px + 44; xx += pill('role: ' + it.role, xx, y + 48, { bg: 'rgba(240,163,90,0.16)', fg: C.orange, size: 14, h: 24 }) + 8;
    if (it.deps.length) pill('dependsOn: ' + it.deps.join(', '), xx, y + 48, { bg: 'rgba(51,156,255,0.14)', fg: '#7cc0ff', size: 14, h: 24 });
    ctx.restore();
  });
  ctx.restore();
  // 右：依賴圖
  const gx = 616, gy = 300, cardW = 282, cardH = 100, ox = gx, oy = gy;
  const flyStart = 0.9, flyGap = 0.18;
  // 連線
  const edges = []; PLAN.forEach(it => it.deps.forEach(d => edges.push([d, it.key])));
  edges.forEach(([from, to], i) => {
    const p = seg(t0, 1.7 + i * 0.12, 2.25 + i * 0.12, ease.inOut); if (p <= 0) return;
    const [x1, y1] = nodeXY(from, ox, oy), [x2, y2] = nodeXY(to, ox, oy);
    const sx = x1 + cardW, sy = y1 + cardH / 2, ex = x2, ey = y2 + cardH / 2;
    ctx.save(); ctx.lineWidth = 3; ctx.strokeStyle = rgba(C.accent, 0.9); ctx.shadowColor = C.accent; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(sx, sy); const mx = (sx + ex) / 2; ctx.bezierCurveTo(mx, sy, mx, ey, ex, ey);
    const len = Math.hypot(ex - sx, ey - sy) * 1.3; ctx.setLineDash([len * p, len]); ctx.stroke();
    if (p >= 1) { ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - 14, ey - 8); ctx.lineTo(ex - 14, ey + 8); ctx.closePath(); ctx.fillStyle = C.accent; ctx.fill(); }
    ctx.restore();
  });
  // 節點卡片：從計畫列表飛出
  const runOrder = ['a', 'b', 'c', 'd', 'e'];
  PLAN.forEach((it, i) => {
    const p = seg(t0, flyStart + i * flyGap, flyStart + 0.7 + i * flyGap, ease.inOut); if (p <= 0) return;
    const [tx, ty] = nodeXY(it.key, ox, oy), fx = px + 24, fy = py + 130 + i * 104;
    const x = lerp(fx, tx, p), y = lerp(fy, ty, p) - Math.sin(p * Math.PI) * 140;
    // 執行狀態：依序派工
    const runAt = 3.3 + i * 0.3, rp = seg(t0, runAt, runAt + 0.3), doneP = seg(t0, runAt + 0.35, runAt + 0.6);
    const status = doneP > 0.5 ? 'in_review' : rp > 0 ? 'in_progress' : (i === 0 ? 'todo' : 'backlog');
    const showModel = t0 > 2.9 + i * 0.08;
    drawCard(x, y, cardW, { title: it.title, tool: 'claude', project: '' }, { h: cardH, alpha: clamp(p * 2), highlight: rp * (1 - doneP * 0.6), status, model: showModel ? `${it.model} · ${it.effort}` : null, progress: rp > 0 && doneP < 1 ? rp : null });
    if (doneP > 0.5) { ctx.save(); ctx.globalAlpha *= doneP; ctx.beginPath(); ctx.arc(x + cardW - 10, y + 10, 13, 0, Math.PI * 2); ctx.fillStyle = C.status.in_review; ctx.fill(); text('✓', x + cardW - 10, y + 11, { size: 15, weight: 800, color: '#0b0f17', align: 'center', baseline: 'middle' }); ctx.restore(); }
  });
  // 派工設定列（選擇工具／模型／effort）

function render(t) {

// ---------- 背景音樂（OfflineAudioContext 合成，約 128 BPM） ----------
async function buildMusic() {
  const sr = 48000, ac = new OfflineAudioContext(2, sr * DUR, sr), BPM = 128, beat = 60 / BPM;
  const master = ac.createGain(); master.gain.value = 0.72;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.12;
  master.connect(comp); comp.connect(ac.destination);
  // 簡易殘響
  const conv = ac.createConvolver(); const irLen = sr * 1.6, ir = ac.createBuffer(2, irLen, sr);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.2); }
  conv.buffer = ir; const rev = ac.createGain(); rev.gain.value = 0.22; conv.connect(rev); rev.connect(master);
  const n2f = n => 440 * Math.pow(2, (n - 69) / 12);
  const osc = (type, freq, t, dur, { gain = 0.2, attack = 0.005, decay = dur, lp = null, pan = 0, send = 0.3, detune = 0 } = {}) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0005, t + decay);
    let node = o; if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(lp, t); f.frequency.exponentialRampToValueAtTime(Math.max(200, lp * 0.25), t + decay); f.Q.value = 2; o.connect(f); node = f; }
    const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(g); g.connect(p); p.connect(master);
    if (send) { const s = ac.createGain(); s.gain.value = send; p.connect(s); s.connect(conv); }
    o.start(t); o.stop(t + decay + 0.05);
  };
  const noise = (t, dur, { gain = 0.1, hp = 6000, pan = 0 } = {}) => {
    const b = ac.createBuffer(1, Math.ceil(sr * dur), sr), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur); const p = ac.createStereoPanner(); p.pan.value = pan;
    s.connect(f); f.connect(g); g.connect(p); p.connect(master); s.start(t); s.stop(t + dur);
  };
  const kick = t => { const o = ac.createOscillator(); o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); const g = ac.createGain(); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32); };
  const snare = t => { noise(t, 0.16, { gain: 0.35, hp: 1800 }); osc('triangle', 190, t, 0.12, { gain: 0.3, send: 0.4 }); };
  // 和弦進行（D 大調 I–V–vi–IV，每小節一個）
  const prog = [[62, 66, 69], [57, 61, 64], [59, 62, 66], [55, 59, 62]];
  const bars = Math.ceil(DUR / (beat * 4));
  for (let bar = 0; bar < bars; bar++) {
    const chord = prog[bar % 4], root = chord[0], t0 = bar * beat * 4;
    for (let b = 0; b < 4; b++) {
      const t = t0 + b * beat; if (t >= DUR - 0.3) continue;
      if (bar >= 1 || b >= 2) kick(t);
      if (b === 1 || b === 3) snare(t);
      // 8 分音符 hi-hat
      noise(t, 0.05, { gain: 0.12, hp: 9000, pan: 0.25 }); noise(t + beat / 2, 0.035, { gain: 0.07, hp: 10000, pan: -0.25 });
      // 低音：根音 8 分音符（八度跳動）
      osc('sawtooth', n2f(root - 24 + (b % 2 ? 12 : 0)), t, beat * 0.5, { gain: 0.26, lp: 900, send: 0.05 });
      osc('sawtooth', n2f(root - 24), t + beat / 2, beat * 0.45, { gain: 0.2, lp: 700, send: 0.05 });
      // 琶音 16 分音符（pluck）
      for (let s = 0; s < 4; s++) { const n = chord[(b * 4 + s) % 3] + 12 + (s === 3 ? 12 : 0); osc('square', n2f(n), t + s * beat / 4, beat * 0.22, { gain: 0.07, lp: 3200, pan: (s - 1.5) * 0.3, send: 0.5 }); }
    }
    // Pad（持續和弦）
    chord.forEach((n, i) => { osc('sawtooth', n2f(n), t0, beat * 4, { gain: 0.045, attack: 0.3, lp: 1800, pan: (i - 1) * 0.5, send: 0.8, detune: (i - 1) * 7 }); osc('sawtooth', n2f(n), t0, beat * 4, { gain: 0.045, attack: 0.3, lp: 1800, pan: (1 - i) * 0.5, send: 0.8, detune: (1 - i) * 7 }); });
    // 主旋律（每兩小節一個樂句）
    const mel = bar % 2 === 0 ? [[0, chord[2] + 12], [0.5, chord[0] + 24], [1, chord[1] + 12], [1.75, chord[2] + 12], [2.5, chord[0] + 24], [3, chord[1] + 24]] : [[0, chord[0] + 24], [0.75, chord[2] + 12], [1.5, chord[1] + 12], [2, chord[0] + 12], [3, chord[2] + 12]];
    if (bar >= 1) mel.forEach(([off, n]) => { const t = t0 + off * beat; if (t < DUR - 0.5) osc('triangle', n2f(n), t, beat * 0.9, { gain: 0.2, attack: 0.01, send: 0.6, pan: 0.1 }); });
  }
  // 結尾重音與閃亮音
  const endT = 13.9; kick(endT); noise(endT, 0.6, { gain: 0.25, hp: 3000 });
  [62, 66, 69, 74, 78, 81].forEach((n, i) => osc('triangle', n2f(n + 12), endT + i * 0.05, 1.1 - i * 0.05, { gain: 0.12, attack: 0.01, send: 0.9, pan: (i - 2.5) * 0.3 }));
  // 整體淡出
  master.gain.setValueAtTime(0.72, DUR - 1.0); master.gain.linearRampToValueAtTime(0.0, DUR - 0.02);
  return ac.startRendering();
}

  const ac = new AudioContext(); await ac.resume(); const buf = await buildMusic(); const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
  const start = performance.now() + 100; src.start(ac.currentTime + 0.1);
  const loop = () => { const t = (performance.now() - start) / 1000; render(t); document.getElementById('seek').value = clamp(t, 0, DUR); document.getElementById('time').textContent = clamp(t, 0, DUR).toFixed(2) + 's'; if (t < DUR) requestAnimationFrame(loop); else playing = false; };
  requestAnimationFrame(loop);
}
document.getElementById('play').onclick = play;
document.getElementById('seek').oninput = e => { if (!playing) { render(+e.target.value); document.getElementById('time').textContent = (+e.target.value).toFixed(2) + 's'; } };

// 錄製：回傳 {mime, size, base64 分段取得}
window.__record = async ({ fps = 30, bitrate = 10e6, mime = 'video/mp4;codecs=avc1.640028,mp4a.40.2' } = {}) => {
  document.body.classList.add('record');
  await window.__ready;
  const buf = await buildMusic();
  const ac = new AudioContext({ sampleRate: 48000 }); await ac.resume();
  const dest = ac.createMediaStreamDestination(); const src = ac.createBufferSource(); src.buffer = buf; src.connect(dest);
  render(0);
  const vs = canvas.captureStream(fps); const stream = new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bitrate, audioBitsPerSecond: 192000 });
  const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => { rec.onstop = r; });
  rec.start(500);
  await new Promise(r => setTimeout(r, 150));
  const start = performance.now(); const acStart = ac.currentTime; src.start(acStart);
  let frames = 0;
  await new Promise(resolve => { const loop = () => { const t = (performance.now() - start) / 1000; render(t); frames++; if (t < DUR + 0.05) requestAnimationFrame(loop); else resolve(); }; requestAnimationFrame(loop); });
  const wall = (performance.now() - start) / 1000, audioElapsed = ac.currentTime - acStart;
  rec.stop(); await stopped; src.stop(); await ac.close();
  let rms = 0; { const d = buf.getChannelData(0); for (let i = 0; i < d.length; i += 7) rms += d[i] * d[i]; rms = Math.sqrt(rms / (d.length / 7)); }
  const blob = new Blob(chunks, { type: rec.mimeType }); const bytes = new Uint8Array(await blob.arrayBuffer());
  let b64 = ''; const CH = 0x8000; for (let i = 0; i < bytes.length; i += CH) b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  window.__b64 = btoa(b64);
  return { mime: rec.mimeType, size: bytes.length, b64len: window.__b64.length, frames, wall, audioElapsed, musicRms: rms, musicDur: buf.duration };
};
window.__chunk = (i, n) => window.__b64.slice(i, i + n);

const q = new URLSearchParams(location.search);
window.__ready.then(() => render(q.has('t') ? +q.get('t') : 0));
</script>
