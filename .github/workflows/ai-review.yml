name: AI Review
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要審查的 PR 編號
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-review-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.AI_MODE == 'claude' || vars.AI_MODE == 'codex' || vars.AI_MODE == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      engine: ${{ steps.prepare.outputs.engine }}
      pr: ${{ steps.prepare.outputs.pr }}
      sha: ${{ steps.prepare.outputs.sha }}
      base_ref: ${{ steps.prepare.outputs.base_ref }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      prompt: ${{ steps.prepare.outputs.prompt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: prepare
        env:
          AI_MODE: ${{ vars.AI_MODE }}
        with:
          script: await require('./scripts/ci/github-automation.cjs').prepareReview({github, context, core});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.pr != ''
        with:
          name: review-diff
          path: work/ai/review.diff
          retention-days: 1
  claude:
    needs: prepare
    if: needs.prepare.outputs.engine == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.agent.outputs.structured_output }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-diff
          path: work/ai
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: work/ai/base
          persist-credentials: false
      - id: schema
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          test -n "$API_KEY$OAUTH_TOKEN" || { echo '請設定 Claude 的 Actions secret'; exit 1; }
          printf 'json=%s\n' "$(cat .github/ai/review.schema.json)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        id: agent
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions[bot]
          prompt: ${{ needs.prepare.outputs.prompt }}
          claude_args: >-
            --max-turns 20 --tools "Read,Glob,Grep" --allowedTools "Read,Glob,Grep"
            --json-schema '${{ steps.schema.outputs.json }}'
  codex:
    needs: prepare
    if: needs.prepare.outputs.engine == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.agent.outputs.final-message }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-diff
          path: work/ai
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: work/ai/base
          persist-credentials: false
      - name: Check OpenAI credential
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$API_KEY" || { echo '請設定 OPENAI_API_KEY Actions secret'; exit 1; }
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        id: agent
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: ${{ needs.prepare.outputs.prompt }}
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
          codex-args: '["--ephemeral", "--output-schema", ".github/ai/review.schema.json"]'
  verdict:
    needs: [prepare, claude, codex]
    if: >-
      always() && needs.prepare.outputs.pr != '' &&
      (needs.claude.result == 'success' || needs.codex.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          AI_RESULT: ${{ needs.claude.outputs.result || needs.codex.outputs.result }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          REVIEWED_SHA: ${{ needs.prepare.outputs.sha }}
          REVIEWED_BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          REVIEWED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          REVIEW_ENGINE: ${{ needs.prepare.outputs.engine }}
          AI_AUTO_MERGE: ${{ vars.AI_AUTO_MERGE }}
        with:
          script: await require('./scripts/ci/github-automation.cjs').finalizeReview({github, context, core});
